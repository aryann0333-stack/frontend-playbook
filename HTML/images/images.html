<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learning about tables and lists">
    <title>Images</title>
</head>

<body>

    <img width="230" height="230" src="train.png" alt="train image ">

    <table>
        <caption>Employee Details</caption>
        <tr>
            <th >Name</th>
            <th>Designation</th>
            <th>FavLanguage</th>
        </tr>

        <tr>
            <td>Aryan</td>
            <td>programmer</td>
            <td>Java</td>

        </tr>

        <tr>
            <td >Prakhr</td>
            <td>influencer</td>
            <td>cpp</td>
        </tr>

        <tr>
            <td>Rituraj</td>
            <td>cricketer</td>
            <td>javaScript</td>
        </tr>

    </table>

        <!-- Unorderd list -->
    <ul type="square">
        <li>Harry</li>
        <li>Shubham</li>
        <li>Aryan</li>
    </ul>

    <!-- ordered list -->
    <ol type="a">
        <li>Harry</li>
        <li>Shubham</li>
        <li>Aryan</li>
    </ol>
</body>

</html>
